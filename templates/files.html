
<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Secure Cloud Storage</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container files-container">

    <h2>Your Uploaded Files 📂</h2>

    <a href="/logout">Logout</a>

    <br><br>

    {% for file in files %}

    <div class="file-card">

        <div>
            <h3>📄 {{ file }}</h3>
            <p class="status">🔒 Encrypted</p>
        </div>

        <div class="menu">

            <button class="menu-btn">⋮</button>

            <div class="menu-content">

                <!-- Download original file -->
                <a href="/download/{{ file }}">⬇ Download</a>

                <!-- Check whether file was changed -->
                <a href="/verify/{{ file }}">✓ Verify Integrity</a>

                <!-- Delete file -->
                <a href="/delete/{{ file }}"
                   onclick="return confirm('Delete this file?')">
                    🗑 Delete
                </a>

            </div>

        </div>

    </div>

    {% endfor %}

    <br>

    <a href="/upload" class="btn">Upload New File</a>

</div>

</body>
</html>
